# Git hooks, managed by Lefthook (https://lefthook.dev). `npm install` installs them.
# To skip them for one command: `LEFTHOOK=0 git commit ...` (or `git commit --no-verify`).

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: npx oxlint --deny-warnings {staged_files}
    - name: format
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,html,yml,yaml}"
      run: npx oxfmt --check {staged_files}
      fail_text: "Run `npm run format` to fix formatting."
    - name: test
      run: npm test --silent

# Slower checks over the whole project, before anything leaves the machine.
pre-push:
  parallel: true
  jobs:
    - name: lint
      run: npm run --silent lint
    - name: format
      run: npm run --silent format:check
    - name: typecheck
      run: npm run --silent typecheck
    - name: test
      run: npm test --silent && npm run --silent test:e2e
